<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="13.5" width="1200" height="1" fill="url(#line)"/>
  <!-- trailing particles -->
  <g fill="#c4b5fd">
    <circle cy="14" r="1.6" opacity=".5"><animate attributeName="cx" values="-30;1230" dur="7s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cy="14" r="1.2" opacity=".4"><animate attributeName="cx" values="-30;1230" dur="7s" begin="-3.5s" repeatCount="indefinite"/></circle>
    <circle cy="14" r="1.4" opacity=".45"><animate attributeName="cx" values="-30;1230" dur="7s" begin="-5.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- traveling light -->
  <circle cy="14" r="4" fill="#67e8f9" filter="url(#glow)">
    <animate attributeName="cx" values="-40;1240" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="14" r="2" fill="#ffffff">
    <animate attributeName="cx" values="-40;1240" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Kartu profil AXRYZURE">
  <title>Kartu profil AXRYZURE</title>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f3d"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1538"/>
      <stop offset="1" stop-color="#150f2e"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="360" rx="24" fill="url(#card)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23" fill="none" stroke="#a78bfa" stroke-opacity=".25"/>

  <!-- ===== terminal ===== -->
  <rect x="40" y="40" width="660" height="280" rx="18" fill="url(#term)" stroke="#302b63" stroke-width="1.5"/>
  <path d="M40 58 A18 18 0 0 1 58 40 H682 A18 18 0 0 1 700 58 V76 H40 Z" fill="#241c4a"/>
  <circle cx="68" cy="58" r="6" fill="#ff5f56"/>
  <circle cx="88" cy="58" r="6" fill="#ffbd2e"/>
  <circle cx="108" cy="58" r="6" fill="#27c93f"/>
  <text x="680" y="63" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="13" fill="#a5b4fc" opacity=".8">profile.sh</text>

  <g font-family="Consolas, Menlo, monospace" font-size="17">
    <text x="72" y="116" fill="#67e8f9" opacity="0">$ whoami
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="72" y="142" fill="#ffffff" font-weight="700" opacity="0">› axryzure — web &amp; bot developer
      <animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="72" y="178" fill="#67e8f9" opacity="0">$ cat profile.json
      <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="72" y="204" fill="#c4b5fd" opacity="0">{
      <animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="96" y="230" fill="#a5f3fc" opacity="0">"based": "Indonesia",
      <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="96" y="256" fill="#fde68a" opacity="0">"stack": ["React", "TypeScript", "Flask"],
      <animate attributeName="opacity" values="0;1" begin="3.1s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="96" y="282" fill="#86efac" opacity="0">"mission": "terus belajar, terus membangun"
      <animate attributeName="opacity" values="0;1" begin="3.5s" dur="0.2s" fill="freeze"/>
    </text>
    <text x="72" y="306" fill="#c4b5fd" opacity="0">}
      <animate attributeName="opacity" values="0;1" begin="3.9s" dur="0.2s" fill="freeze"/>
    </text>
    <!-- blinking cursor -->
    <rect x="72" y="316" width="11" height="3" fill="#67e8f9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.05;.1;.5;.55;1" dur="1.1s" begin="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== profile panel ===== -->
  <rect x="730" y="40" width="430" height="280" rx="18" fill="#0f0c29" fill-opacity=".7" stroke="#302b63" stroke-width="1.5"/>

  <!-- avatar with rotating ring -->
  <circle cx="820" cy="130" r="58" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="2" stroke-dasharray="10 8"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 820 130" to="360 820 130" dur="16s" repeatCount="indefinite"/>
    <circle cx="820" cy="72" r="5" fill="#67e8f9" filter="url(#glow)"/>
  </g>
  <circle cx="820" cy="130" r="42" fill="url(#avatar)" filter="url(#glow)" opacity=".9"/>
  <text x="820" y="141" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">AX</text>

  <text x="892" y="122" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="3">AXRYZURE</text>
  <text x="892" y="150" font-family="Consolas, Menlo, monospace" font-size="14" fill="#a5b4fc">@superrrkyy · Indonesia</text>
  <text x="892" y="172" font-family="Consolas, Menlo, monospace" font-size="13" fill="#67e8f9" opacity=".9">● available for projects</text>

  <!-- skill bars -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#e9d5ff">
    <text x="762" y="218">Frontend · React</text>
    <text x="1138" y="218" text-anchor="end" fill="#67e8f9">85%</text>
    <rect x="762" y="228" width="376" height="10" rx="5" fill="#241c4a"/>
    <rect x="762" y="228" width="0" height="10" rx="5" fill="url(#bar)">
      <animate attributeName="width" values="0;320;320" keyTimes="0;.35;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="762" y="256">Bot &amp; Automation</text>
    <text x="1138" y="256" text-anchor="end" fill="#67e8f9">80%</text>
    <rect x="762" y="266" width="376" height="10" rx="5" fill="#241c4a"/>
    <rect x="762" y="266" width="0" height="10" rx="5" fill="url(#bar)">
      <animate attributeName="width" values="0;301;301" keyTimes="0;.35;1" dur="7s" begin="0.4s" repeatCount="indefinite"/>
    </rect>

    <text x="762" y="294">Backend &amp; API</text>
    <text x="1138" y="294" text-anchor="end" fill="#67e8f9">70%</text>
    <rect x="762" y="304" width="376" height="10" rx="5" fill="#241c4a"/>
    <rect x="762" y="304" width="0" height="10" rx="5" fill="url(#bar)">
      <animate attributeName="width" values="0;263;263" keyTimes="0;.35;1" dur="7s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

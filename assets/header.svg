<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset=".5" stop-color="#302b63"/><stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="600" cy="130" r="260" fill="url(#glow)">
    <animate attributeName="r" values="230;280;230" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fff">
    <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="190" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="70" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="200" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="50" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1.1"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="10" fill="url(#txt)">AXRYZURE
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="190" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="24" fill="#c4b5fd" letter-spacing="3">Web &amp; Bot Developer • Indonesia</text>
  <path fill="#0d1117" d="M0 250 Q150 210 300 245 T600 245 T900 245 T1200 240 V300 H0Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 250 Q150 210 300 245 T600 245 T900 245 T1200 240 V300 H0Z;M0 240 Q150 270 300 240 T600 250 T900 235 T1200 250 V300 H0Z;M0 250 Q150 210 300 245 T600 245 T900 245 T1200 240 V300 H0Z"/>
  </path>
</svg>
